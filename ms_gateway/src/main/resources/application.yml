server:
  port: 8090

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: ms-ventas
          uri: lb://MS-VENTAS
          predicates:
            - Path=/api/v1/ventas/**
            
        - id: ms-catalogo
          uri: lb://MS-CATALOGO
          predicates:
            - Path=/api/v1/productos/**
            
        - id: ms-inventario
          uri: lb://MS-INVENTARIO
          predicates:
            - Path=/api/v1/inventario/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/