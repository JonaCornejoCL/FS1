server:
  port: 8090 #-- (ahí le explico profe) --#

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: ventas_route
              uri: lb://MS-VENTAS
              predicates:
                - Path=/api/v1/ventas/**
                
            - id: catalogo_route
              uri: lb://MS-CATALOGO
              predicates:
                - Path=/api/v1/productos/**
                
            - id: inventario_route
              uri: lb://MS-INVENTARIO
              predicates:
                - Path=/api/v1/inventario/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/